<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinFlow - 家計・サブスク管理</title>
  <!-- ============================================================
       アセットのバージョンクエリ (?v=)
       ------------------------------------------------------------
       ビルドステップを持たない方針のため、CSS/JS のキャッシュ破棄は
       この手書きのバージョン文字列で行う。**CSS または JS を変更したら
       必ずこの値を更新すること。**
       サーバー側の Cache-Control: no-cache (Program.cs) と二重の防御。
       no-cache は「これから取得するもの」を確実に新しくするが、
       すでに端末に焼き付いてしまったキャッシュには URL を変える
       この方法でしか即座に対抗できない。

       限界: ES モジュールの import 指定子にクエリは伝播しないため、
       app.js が import する router.js / utils/*.js / pages/*.js には
       ?v= が付かない。それらはサーバー側の no-cache に依存する。
       （全 import に手で ?v= を書くのは保守性を著しく損なうため採用しない）
       ============================================================ -->
  <link rel="stylesheet" href="/css/main.css?v=20260727">
  <link rel="stylesheet" href="/css/components.css?v=20260727">
  <link rel="stylesheet" href="/css/pages.css?v=20260727">
  <!-- Chart.js はダッシュボード表示時のみ dashboard-page.js が動的に読み込む。
       ここで同期 <script> として読むと、インターネットに出られない LAN 内
       （ラズパイ運用）で DNS/TCP タイムアウトまで <body> の解析が止まる。 -->
</head>
<body>
  <div id="app">
    <!-- Sidebar dim overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <nav id="sidebar" class="sidebar sidebar--hidden">
      <div class="sidebar__logo">
        <span class="sidebar__logo-icon">&#x1F4B0;</span>
        <span class="sidebar__logo-text">FinFlow</span>
      </div>
      <ul class="sidebar__nav">
        <li><a href="/dashboard" class="sidebar__link" data-navigo>ダッシュボード</a></li>
        <li><a href="/expenses" class="sidebar__link" data-navigo>支出管理</a></li>
        <li><a href="/subscriptions" class="sidebar__link" data-navigo>サブスク管理</a></li>
        <li><a href="/categories" class="sidebar__link" data-navigo>カテゴリ</a></li>
        <li><a href="/import" class="sidebar__link" data-navigo>CSV取込</a></li>
      </ul>
      <div class="sidebar__footer">
        <button id="logout-btn" class="sidebar__logout">ログアウト</button>
      </div>
    </nav>

    <main id="main-content" class="main-content">
      <!-- Hamburger menu button (visible on mobile when authenticated) -->
      <button
        id="hamburger-btn"
        class="hamburger-btn"
        type="button"
        aria-label="メニューを開く"
        aria-expanded="false"
        aria-controls="sidebar"
        hidden
      >
        <span class="hamburger-btn__icon" aria-hidden="true">
          <span class="hamburger-btn__bar"></span>
          <span class="hamburger-btn__bar"></span>
          <span class="hamburger-btn__bar"></span>
        </span>
      </button>

      <div id="page-container"></div>
    </main>
  </div>

  <!-- Global toast notifications -->
  <ff-toast></ff-toast>

  <script type="module" src="/js/app.js?v=20260727"></script>
</body>
</html>
